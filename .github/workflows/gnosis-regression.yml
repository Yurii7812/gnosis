name: Gnosis regression checks
on:
  pull_request:
    paths:
      - "bin/**"
      - "install/**"
      - "autoload/**"
      - "android/**"
      - "python/**"
      - "test/**"
      - ".github/workflows/gnosis-regression.yml"
  workflow_dispatch:

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # install_update_net.sh needs a branch checkout, not GitHub's detached merge SHA.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vim git python3 python3-venv
      - name: Check launcher and installer syntax
        run: |
          sh -n bin/gnosis
          sh -n install/install.sh
          node --check bin/gnosis-kwin-maximize.js
      - name: Test phone capture, vault isolation and topic organization
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 python/test_capture_import.py
          python3 python/test_capture_merge.py
          python3 python/test_orphans.py
          sh test/capture_import_net.sh
          sh test/capture_merge_net.sh
          sh test/capture_diary_net.sh
          sh test/capture_embed_net.sh
          sh test/capture_topics_net.sh
      - name: Test Python note relationship synchronization
        run: |
          python3 python/test_note_format_v2.py
          python3 python/test_context_ops.py
      - name: Test zk n/g and guide relationships
        run: |
          python3 -m venv "$RUNNER_TEMP/gnosis-test-venv"
          "$RUNNER_TEMP/gnosis-test-venv/bin/python" -m pip install --quiet pykakasi pyte
          export PATH="$RUNNER_TEMP/gnosis-test-venv/bin:$PATH"
          sh test/link_ops_net.sh
          sh test/guide_relations_net.sh
      - name: Test IME isolation and external-edit conflict handling
        env:
          TMPDIR: ${{ runner.temp }}
          GNOSIS_LANG: ja
        run: |
          . test/noclip.sh
          python3 test/fcitx_isolation_check.py
          "$RUNNER_TEMP/gnosis-test-venv/bin/python" test/keys_pty_check.py TestConcurrentEdit
          sh test/session_net.sh
      - name: Test timeline record kind rename
        env:
          TMPDIR: ${{ runner.temp }}
          GNOSIS_LANG: ja
        run: |
          . test/noclip.sh
          python3 python/test_diary_tree.py
          sh test/record_rename_net.sh
      - name: Test list navigation, checkbox links and concealed insert cursor
        env:
          TMPDIR: ${{ runner.temp }}
          GNOSIS_HOME: ${{ runner.temp }}/gnosis-list-tests
          GNOSIS_LANG: ja
        run: |
          . test/noclip.sh
          export PATH="$RUNNER_TEMP/gnosis-test-venv/bin:$PATH"
          sh test/listnav_net.sh
          python3 test/listnav_pty_check.py
          python3 test/checkbox_linkify_check.py
          python3 test/link_source_pty_check.py
          python3 test/note_cursor_pty_check.py
      - name: Test full Vim feature detection beyond line 40
        run: sh test/vim_version_detection_net.sh
      - name: Test GNOME Terminal's isolated font profile
        run: sh test/gnome_font_profile_net.sh
      - name: Test saved tab boards
        run: sh test/tabs_board_net.sh
      - name: Test mandala direction, GUI and CUI state handoff and close keys
        env:
          TMPDIR: ${{ runner.temp }}
          GNOSIS_LANG: ja
        run: |
          sh test/mview_net.sh
          sh test/mview_depth_net.sh
          sh test/mview_handoff_net.sh
          python3 test/close_keys_pty_check.py
      - name: Test saved font settings and terminal launch arguments
        run: sh test/termfont_net.sh
      - name: Test autosave versus asynchronous sync while editing
        run: sh test/autosync_dirty_guard_net.sh
      - name: Test diary hierarchy across year rollover
        run: sh test/diary_hierarchy_net.sh
      - name: Test Folgezettel Branch relationships and new-note placement
        run: |
          # Japanese kana sorting tests require pykakasi (Gnosis normally installs it in a venv).
          python3 -m venv "$RUNNER_TEMP/gnosis-test-venv"
          "$RUNNER_TEMP/gnosis-test-venv/bin/python" -m pip install --quiet pykakasi
          export PATH="$RUNNER_TEMP/gnosis-test-venv/bin:$PATH"
          python3 python/test_branch_ops.py
          sh test/branch_net.sh
          sh test/link_ops_net.sh
          python3 test/check_guide.py
          sh test/guide_relations_net.sh
      - name: Test focus escape recognition and consistent Markdown prose colors
        run: sh test/focus_markdown_net.sh
      - name: Test Gnosis color highlight recovery
        run: sh test/color_highlight_net.sh
      - name: Test startup icon colors
        run: sh test/icon_palette_net.sh
      - name: Test Index and guide relations
        run: sh test/guide_relations_net.sh
      - name: Test auto-updater using local Git repositories
        run: sh test/install_update_net.sh

  windows-installer-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documented installer in Windows PowerShell 5.1
        shell: powershell
        run: .\\test\\windows_ps51_installer.ps1
      - name: Run the same installer tests in PowerShell 7
        shell: pwsh
        run: ./test/windows_ps51_installer.ps1

  android-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build Android capture
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gnosis-capture-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
