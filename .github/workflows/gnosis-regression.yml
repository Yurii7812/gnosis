name: Gnosis regression checks
on:
  pull_request:
    paths:
      - "bin/**"
      - "install/**"
      - "autoload/**"
      - "test/**"
      - ".github/workflows/gnosis-regression.yml"
  workflow_dispatch:

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # install_update_net.sh needs a branch checkout, not GitHub's detached merge SHA.
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vim git python3
      - name: Check launcher and installer syntax
        run: |
          sh -n bin/gnosis
          sh -n install/install.sh
          node --check bin/gnosis-kwin-maximize.js
      - name: Test GNOME Terminal's isolated font profile
        run: sh test/gnome_font_profile_net.sh
      - name: Test tab management, outline visual range and mode readability
        run: sh test/work_tabs_outline_net.sh
      - name: Test saved font settings and terminal launch arguments
        run: sh test/termfont_net.sh
      - name: Test autosave versus asynchronous sync while editing
        run: sh test/autosync_dirty_guard_net.sh
      - name: Test diary hierarchy across year rollover
        run: sh test/diary_hierarchy_net.sh
      - name: Test focus escape recognition and consistent Markdown prose colors
        run: sh test/focus_markdown_net.sh
      - name: Test Gnosis color highlight recovery
        run: sh test/color_highlight_net.sh
      - name: Test startup icon colors
        run: sh test/icon_palette_net.sh
      - name: Test Index and guide relations
        run: sh test/guide_relations_net.sh
      - name: Test auto-updater using local Git repositories
        run: sh test/install_update_net.sh

  windows-installer-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify documented installer in Windows PowerShell 5.1
        shell: powershell
        run: .\\test\\windows_ps51_installer.ps1
      - name: Build the actual Windows Electron GUI and native PTY
        shell: pwsh
        working-directory: web
        run: |
          npm ci --no-audit --no-fund --include=optional
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run rebuild:pty
          if ($LASTEXITCODE -ne 0) { throw 'node-pty Electron rebuild failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Gnosis UI build failed' }
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) {
            Write-Host 'Installing missing Electron executable separately'
            Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
            Push-Location node_modules/electron
            try {
              node install.js
              if ($LASTEXITCODE -ne 0) { throw 'Electron binary download failed' }
            } finally { Pop-Location }
          }
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) { throw 'Missing Electron GUI executable' }
          if (-not (Test-Path node_modules/node-pty)) { throw 'Missing Windows native PTY' }
          if (-not (Test-Path bundle.js)) { throw 'Missing Gnosis GUI bundle' }
      - name: Validate Windows installer PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "install/install-windows.ps1").Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
