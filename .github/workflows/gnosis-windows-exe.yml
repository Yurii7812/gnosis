name: Build Gnosis-Setup.exe for Windows

on:
  pull_request:
    paths:
      - "install/gnosis-setup.iss"
      - "install/bootstrap.ps1"
      - ".github/workflows/gnosis-windows-exe.yml"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "install/gnosis-setup.iss"
      - "install/bootstrap.ps1"
      - ".github/workflows/gnosis-windows-exe.yml"

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify bootstrap PowerShell 5.1 syntax
        shell: powershell
        run: |
          $path = Join-Path (Get-Location) 'install\bootstrap.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          Write-Host 'PowerShell bootstrap syntax OK'
      - name: Compile standalone downloadable EXE
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install build-time Inno Setup compiler' }
          }
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw 'Inno Setup compiler is unavailable'
          }
          $out = Join-Path $env:RUNNER_TEMP 'GnosisWindows'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & $compiler "/O$out" "install\gnosis-setup.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Gnosis Windows EXE compilation failed' }
          $exe = Join-Path $out 'Gnosis-Setup.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Expected Gnosis-Setup.exe missing' }
          $len = (Get-Item -LiteralPath $exe).Length
          if ($len -lt 200000) { throw "Unexpectedly small installer ($len bytes)" }
          Write-Host "EXE produced: $exe ($len bytes)"
      - name: Upload downloadable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Gnosis-Setup-Windows
          path: ${{ runner.temp }}/GnosisWindows/Gnosis-Setup.exe
          if-no-files-found: error
          retention-days: 30

  # No GitHub Release or GitHub account needed for end users.
  # Store the small compiled EXE directly in the public repository on main,
  # where raw.githubusercontent.com can serve it indefinitely.
  repository-download:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: Gnosis-Setup-Windows
          path: build
      - name: Publish direct-download EXE and SHA-256 to downloads/
        shell: bash
        run: |
          set -euo pipefail
          test -s build/Gnosis-Setup.exe
          test "$(head -c 2 build/Gnosis-Setup.exe)" = "MZ"
          mkdir -p downloads
          cp build/Gnosis-Setup.exe downloads/Gnosis-Setup.exe
          (cd downloads && sha256sum Gnosis-Setup.exe > Gnosis-Setup.exe.sha256)
          git add downloads/Gnosis-Setup.exe downloads/Gnosis-Setup.exe.sha256
          if git diff --cached --quiet; then
            echo "The published EXE already matches the latest Windows build."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "build(windows): publish Gnosis-Setup.exe for direct download [skip ci]"
          git push origin HEAD:main
          echo "Direct download: https://raw.githubusercontent.com/Yurii7812/gnosis/main/downloads/Gnosis-Setup.exe"
