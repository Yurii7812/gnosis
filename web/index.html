<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gnosis</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="launching">
  <!-- 起動画面・vault の選択と管理・設定（src/launcher.js）。白背景・黒文字 -->
  <div id="launcher" class="launcher" hidden></div>
  <!-- 本体: 曼荼羅（開いているときだけ左）とマークダウン表示。下に Vim の端末（普段は下の 2 行だけ） -->
  <div id="stage">
    <div id="main">
      <div id="mandala" hidden></div>
      <div id="view" class="view"></div>
    </div>
    <div id="termwrap" class="strip">
      <div id="term"></div>
    </div>
  </div>
  <div id="statusbar">
    <span id="mode" class="mode normal">NORMAL</span>
    <span id="file" class="file"></span>
    <span id="dirty" class="dirty"></span>
    <span id="err" class="err" hidden></span>
  </div>
  <!-- 紙のスキャンの番号付け（\F。src/scan.js） -->
  <div id="scan" hidden></div>
  <script src="bundle.js"></script>
</body>
</html>
