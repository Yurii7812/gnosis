<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gnosis</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="launching">
  <!-- 起動画面・vault の選択と管理・設定（src/launcher.js）。白背景・黒文字 -->
  <div id="launcher" class="launcher" hidden></div>
  <!-- 本体: 曼荼羅（開いているときだけ左）とマークダウン表示。下に Vim の端末（普段は下の 2 行だけ） -->
  <div id="stage">
    <div id="main">
      <div id="mandala" hidden></div>
      <div id="view" class="view"></div>
      <div id="outline" hidden></div>
    </div>
    <div id="termwrap" class="strip">
      <div id="term"></div>
    </div>
  </div>
  <div id="statusbar">
    <span id="mode" class="mode normal">NORMAL</span>
    <span id="file" class="file"></span>
    <span id="dirty" class="dirty"></span>
    <span id="termwhy" class="termwhy"></span>
    <span id="err" class="err" hidden></span>
  </div>
  <!-- リンクを開いた HTML をアプリの中で表示する重ね表示（q か Esc で閉じる） -->
  <div id="htmlview" class="htmlview" hidden tabindex="-1">
    <div class="hv-head"><span id="hv-name"></span><span class="hv-hint">q / Esc で閉じる</span><button id="hv-close" type="button" aria-label="閉じる">×</button></div>
    <iframe id="hv-frame" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
  </div>
  <!-- 紙のスキャンの番号付け（\F。src/scan.js） -->
  <div id="scan" hidden></div>
  <!-- 時系列記録の日付指定（\D）・上位の設定（\E）（src/record.js） -->
  <div id="recordpick" hidden></div>
  <script src="bundle.js"></script>
</body>
</html>
