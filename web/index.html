<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gnosis</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="launching">
  <!-- 起動画面・vault の選択と管理・設定（src/launcher.js）。白背景・黒文字 -->
  <div id="launcher" class="launcher" hidden></div>
  <!-- モードの切り替えと、GUI 編集の道具。キーでもできる操作は、全部ここのボタンからもできる -->
  <div id="toolbar" role="toolbar" aria-label="Gnosis">
    <span class="grp" id="modes">
      <button type="button" data-mode="vim" title="本物の Vim で編集（Alt+V で閲覧専用に）">Vim</button>
      <button type="button" data-mode="gui" title="GUI 編集: Vim を知らなくても書ける普通のエディタ（Alt+E）">GUI 編集</button>
      <button type="button" data-mode="view" title="閲覧専用: 何を押してもノートは変わらない（Alt+V）">閲覧</button>
    </span>
    <span class="grp" id="edit-tools" hidden>
      <button type="button" data-cmd="bold" title="太字（Ctrl+B）"><b>B</b></button>
      <button type="button" data-cmd="italic" title="斜体（Ctrl+I）"><i>I</i></button>
      <button type="button" data-cmd="strike" title="取り消し線"><s>S</s></button>
      <button type="button" data-cmd="code" title="コード（Ctrl+E）">&lt;/&gt;</button>
      <span class="sep"></span>
      <button type="button" data-cmd="h1" title="見出し 1">H1</button>
      <button type="button" data-cmd="h2" title="見出し 2">H2</button>
      <button type="button" data-cmd="h3" title="見出し 3">H3</button>
      <span class="sep"></span>
      <button type="button" data-cmd="bullet" title="箇条書き">• 箇条</button>
      <button type="button" data-cmd="number" title="番号つき">1. 番号</button>
      <button type="button" data-cmd="task" title="チェックボックスの行">☐ 作業</button>
      <button type="button" data-cmd="checkbox" title="チェックを入れる／外す">☑ 切替</button>
      <button type="button" data-cmd="quote" title="引用">❝ 引用</button>
      <span class="sep"></span>
      <button type="button" data-cmd="link" title="リンク（Ctrl+K）">リンク</button>
      <button type="button" data-cmd="openLink" title="カーソルのリンクを開く（Ctrl+クリック）">開く</button>
      <span class="sep"></span>
      <button type="button" data-cmd="undo" title="元に戻す（Ctrl+Z）">↶ 戻す</button>
      <button type="button" data-cmd="redo" title="やり直す（Ctrl+Y）">↷ やり直す</button>
      <button type="button" data-cmd="save" title="保存（Ctrl+S。自動でも保存します）">保存</button>
    </span>
    <span id="save-state" class="save-state"></span>
  </div>
  <!-- 競合: 編集中に別のもの（別の Vim・スマホ取り込み）がファイルを書き換えた -->
  <div id="conflict" role="alertdialog" hidden>
    <span class="msg"></span>
    <button type="button" data-act="mine">自分の版を残す</button>
    <button type="button" data-act="theirs">ディスクの版を読み込む</button>
    <button type="button" data-act="later">あとで</button>
  </div>
  <!-- 短い入力（リンク先など）。Electron には window.prompt が無いので自前 -->
  <div id="ask" role="dialog" hidden>
    <label></label> <input type="text" size="40"> <button type="button" data-act="ok">OK</button> <button type="button" data-act="cancel">やめる</button>
  </div>
  <div id="stage">
    <div id="view" class="view"></div>
    <div id="termwrap" class="strip">
      <div id="term"></div>
    </div>
  </div>
  <div id="statusbar">
    <span id="mode" class="mode normal">NORMAL</span>
    <span id="file" class="file"></span>
    <span id="dirty" class="dirty"></span>
    <span id="err" class="err" hidden></span>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
