<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>simple_yurii_note</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="layout">
      <aside id="sidebar">
        <div id="toolbar" class="side-tools">
          <button id="new-btn" class="icon-btn" title="新しいノート (Ctrl+N)" aria-label="新しいノート">
            <svg class="ico" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9 15h6"/></svg>
          </button>
          <button id="new-group-btn" class="icon-btn" title="新しいグループ" aria-label="新しいグループ">
            <svg class="ico" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
          </button>
          <span class="spacer"></span>
          <button id="graph-btn" class="icon-btn" title="全体グラフ" aria-label="全体グラフ">
            <svg class="ico" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7.5l8 0M7.5 8l3.5 8M16.5 9.5l-3.5 6.5"/></svg>
          </button>
          <button id="open-btn" class="icon-btn" title="vault を開く" aria-label="vault を開く">
            <svg class="ico" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1H7l-4 9z"/><path d="M7 10h15l-3.5 9H3.5"/></svg>
          </button>
        </div>
        <div class="side-head">
          <input id="search" type="search" placeholder="ノートを絞り込む">
        </div>
        <div class="sort-row">
          <select id="sort-key" title="並び替え">
            <option value="name">名前順</option>
            <option value="mtime">更新日順</option>
            <option value="ctime">作成日順</option>
          </select>
          <button id="sort-dir" class="text-btn" title="正順 / 逆順の切替">正順</button>
        </div>
        <div id="note-list" class="note-list"></div>
        <div class="side-foot">
          <span id="vault-name" class="vault-name">vault 未選択</span>
          <span class="spacer"></span>
          <button id="theme-btn" class="icon-btn" title="ライト / ダーク切替" aria-label="テーマ切替">🌙</button>
        </div>
      </aside>

      <section id="center">
        <div class="tabbar">
          <div class="nav-btns">
            <button id="back-btn" class="icon-btn" title="戻る (Alt+←)" aria-label="戻る" disabled>
              <svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <button id="fwd-btn" class="icon-btn" title="進む (Alt+→)" aria-label="進む" disabled>
              <svg class="ico" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
          <div id="tabs" class="tabs"></div>
          <div class="tab-actions">
            <button id="delete-btn" class="icon-btn" title="このノートを削除" aria-label="削除">
              <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
            </button>
            <button id="save-btn" class="text-btn" title="保存 (Ctrl+S)" disabled>保存</button>
          </div>
        </div>
        <div id="workspace">
          <div id="global-graph" class="global-graph" hidden>
            <div class="gg-head">
              <span class="gg-title">全体グラフ</span>
              <span id="gg-count" class="gg-count"></span>
              <span class="spacer"></span>
              <div class="gg-buttons">
                <button id="gg-full" class="text-btn" title="グラフを全画面にする／ノートと並べる">全画面</button>
                <button id="gg-reset" class="text-btn" title="表示の位置とズームを戻す">表示を戻す</button>
                <button id="gg-relayout" class="text-btn" title="ノートの配置を作り直す">配置を作り直す</button>
                <button id="gg-close" class="text-btn" title="閉じる (Esc)">閉じる</button>
              </div>
            </div>
            <svg id="global-svg" class="global-svg" role="img" aria-label="全体グラフ"></svg>
            <div class="gg-hint">ドラッグで移動・ノートを動かすと位置を保存・クリックでそのノートを右に開く・ホイールでズーム</div>
          </div>
          <div id="split-handle" class="split-handle" hidden title="ドラッグで幅を変える"></div>
          <div id="note-pane">
            <div id="note-view" hidden>
              <div class="view-header"><input id="title-input" class="title-input" disabled placeholder="タイトル"></div>
              <div id="editor" class="editor"></div>
            </div>
            <div id="empty" class="empty">
              <div class="empty-box">
                <div class="empty-title">ノートが開かれていません</div>
                <div class="empty-hint"><kbd>Ctrl</kbd>+<kbd>O</kbd> でノートを開く　<kbd>Ctrl</kbd>+<kbd>N</kbd> で新しいノート</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside id="relations">
        <div class="rel-tools">
          <span class="rel-tools-title">リンク</span>
          <span class="spacer"></span>
          <button id="panel-cfg-btn" class="icon-btn" title="右パネルの表示を選ぶ" aria-label="表示設定">
            <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
        </div>
        <div id="panel-menu" class="panel-menu" hidden>
          <label><input type="checkbox" data-panel="graph"> ローカルグラフ</label>
          <label><input type="checkbox" data-panel="parent"> 親 (Parent)</label>
          <label><input type="checkbox" data-panel="related"> 関連 (Related)</label>
          <label><input type="checkbox" data-panel="children"> 子 (本文リンク)</label>
          <label><input type="checkbox" data-panel="back"> 被リンク (BackLink)</label>
        </div>
        <div id="rel-graph" class="rel-block graph-block">
          <div class="rel-head-row">
            <span class="rel-head">ローカルグラフ</span>
            <span class="spacer"></span>
            <select id="graph-depth" title="つながりの深さ">
              <option value="1">深さ 1</option>
              <option value="2">深さ 2</option>
            </select>
          </div>
          <svg id="graph-svg" class="graph-svg" role="img" aria-label="ローカルグラフ"></svg>
        </div>
        <div id="rel-parent" class="rel-block" data-panel="parent"></div>
        <div id="rel-related" class="rel-block" data-panel="related"></div>
        <div id="rel-children" class="rel-block" data-panel="children"></div>
        <div id="rel-back" class="rel-block" data-panel="back"></div>
      </aside>
    </main>
    <footer id="statusbar">
      <span id="save-state" class="save-state">—</span>
      <span class="spacer"></span>
      <span id="stat-count" class="stat"></span>
    </footer>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-box">
      <h2>simple_yurii_note</h2>
      <p id="overlay-msg"></p>
      <button id="overlay-open" class="primary">vault を開く</button>
      <button id="overlay-pick" style="display:none"></button>
      <p class="hint">Electron アプリとして起動するのが既定です（Vim で <b>\A</b> / <code>npm run app</code>）。</p>
    </div>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast"></div>

  <script src="bundle.js"></script>
</body>
</html>
